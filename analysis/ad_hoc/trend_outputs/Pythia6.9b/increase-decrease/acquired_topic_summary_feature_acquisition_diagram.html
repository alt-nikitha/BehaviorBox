
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8" />
        <title>Feature Acquisition Diagram</title>

        <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            padding: 30px;
        }
        h1 {
            text-align: center;
        }
        .lane-container {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
        }
        .lane {
            width: 28%;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .lane h2 {
            text-align: center;
        }
        .item {
            background: #eef2ff;
            margin: 8px 0;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
        }
        </style>

        </head>
        <body>

        <h1>Feature Acquisition Diagram</h1>
        <p style="text-align:center;">Automatic Early / Mid / Late Breakdown</p>

        <div class="lane-container">

        <!-- EARLY -->
        <div class="lane">
            <h2>Early (≤ 512)</h2>
            <div class="item">Contractions and Informal Language</div><div class="item">Technical Documentation Formatting</div>
        </div>

        <!-- MID -->
        <div class="lane">
            <h2>Mid (1000–70000)</h2>
            
        </div>

        <!-- LATE -->
        <div class="lane">
            <h2>Late (≥ 70000)</h2>
            
        </div>

        </div>

        </body>
        </html>
